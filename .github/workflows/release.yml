name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra s3

      - name: Validate release metadata
        run: >-
          uv run python scripts/check_release_metadata.py
          --tag "${{ github.ref_name }}"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test with coverage
        run: uv run pytest --cov=open_transcribe --cov-report=term-missing --cov-report=xml

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

      - name: Build source and wheel distributions
        run: uv build

      - name: Inspect distribution contents
        run: uv run python scripts/check_distribution.py

      - name: Smoke-test the installed wheel
        shell: bash
        run: |
          set -euo pipefail
          release_root="$PWD"
          smoke_dir="$(mktemp -d)"
          uv venv --clear "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/*.whl
          cd "$smoke_dir"
          OT_HOST=127.0.0.1 \
            OT_PORT=8765 \
            OT_SECURITY__BEARER_TOKEN=release-smoke-token \
            "$smoke_dir/venv/bin/open-transcribe-mcp" >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/healthz; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          cat server.log
          echo "Installed wheel did not become healthy: $release_root" >&2
          exit 1

      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/open-transcribe-mcp/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Wait for the PyPI release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://pypi.org/pypi/open-transcribe-mcp/${version}/json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "PyPI did not expose open-transcribe-mcp ${version} in time" >&2
          exit 1

      - name: Install verified MCP publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}" \
            --output "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check
          tar --no-same-owner -xzf "$archive" mcp-publisher
          chmod 0755 mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP server metadata
        run: ./mcp-publisher publish server.json

      - name: Verify MCP Registry publication
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          version="${version#v}"
          endpoint="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.fbossiere%2Fopen-transcribe-mcp/versions/${version}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$endpoint" | \
              jq --exit-status --arg version "$version" '.server.version == $version' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "MCP Registry did not expose version ${version} in time" >&2
          exit 1

  publish-container:
    name: Publish container to GHCR
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish container
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --push \
            --metadata-file container-metadata.json \
            --tag "${repository}:${version}" \
            --tag "${repository}:${major}" \
            --tag "${repository}:latest" \
            .
          digest="$(jq --raw-output '."containerimage.digest"' container-metadata.json)"
          test "$digest" != null
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "${repository}@${digest}" >container-digest.txt

      - name: Make container package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH
          /users/${{ github.repository_owner }}/packages/container/open-transcribe-mcp
          -f visibility=public

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Install checksum-verified Trivy
        run: scripts/install-trivy.sh "$RUNNER_TEMP/trivy-bin"

      - name: Generate container SBOM
        shell: bash
        run: |
          set -euo pipefail
          image="$(cat container-digest.txt)"
          "$RUNNER_TEMP/trivy-bin/trivy" image \
            --format cyclonedx \
            --output open-transcribe-mcp-container.cdx.json \
            "$image"

      - name: Upload container release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: container-release-metadata
          path: |
            container-digest.txt
            open-transcribe-mcp-container.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish-github-release:
    name: Publish GitHub release
    needs:
      - publish-container
      - publish-mcp-registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-distributions
          path: release-assets/

      - name: Download container release metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: container-release-metadata
          path: release-assets/

      - name: Generate release checksums
        working-directory: release-assets
        run: sha256sum *.whl *.tar.gz *.txt *.json >SHA256SUMS

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*.whl
          release-assets/*.tar.gz
          release-assets/container-digest.txt
          release-assets/open-transcribe-mcp-container.cdx.json
          release-assets/SHA256SUMS
          --repo "${{ github.repository }}"
          --title "OpenTranscribe MCP ${{ github.ref_name }}"
          --generate-notes
          --latest
          --verify-tag

      - name: Verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}")"
          jq --exit-status \
            '(.draft == false) and (.prerelease == false) and (.immutable == true) and (.assets | length == 5)' \
            <<<"$release" >/dev/null
