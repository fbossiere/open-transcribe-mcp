name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra s3

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test with coverage
        run: uv run pytest --cov=open_transcribe --cov-report=term-missing --cov-report=xml

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Validate release metadata coherence
        run: python scripts/check_release_metadata.py --tag "v$(uv version --short)"

      - name: Build source and wheel distributions
        run: uv build

      - name: Inspect distribution contents
        run: python scripts/check_distribution.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install locked documentation dependencies
        run: uv sync --locked --extra dev

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest-known
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra s3

      - name: Audit Python dependencies
        run: uv run pip-audit

      - name: Install checksum-verified Trivy
        run: scripts/install-trivy.sh "$RUNNER_TEMP/trivy-bin"

      - name: Scan repository
        run: >-
          "$RUNNER_TEMP/trivy-bin/trivy" fs
          --scanners vuln,secret,misconfig
          --skip-dirs .git
          --skip-dirs .venv
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          .

      - name: Build container for scanning
        run: docker build --tag open-transcribe-ci:${{ github.sha }} .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          container_name="open-transcribe-ci-${GITHUB_RUN_ID}"
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:8765:8000 \
            --env OT_SECURITY__BEARER_TOKEN=ci-smoke-token \
            "open-transcribe-ci:${GITHUB_SHA}"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/healthz; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -qx true; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

      - name: Scan container
        run: >-
          "$RUNNER_TEMP/trivy-bin/trivy" image
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          open-transcribe-ci:${{ github.sha }}

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: infra/scaleway

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        env:
          TERRAFORM_VERSION: 1.16.1
        run: |
          curl --fail --silent --show-error --location \
            https://apt.releases.hashicorp.com/gpg \
            --output /tmp/hashicorp.asc
          test "$(gpg --show-keys --with-colons /tmp/hashicorp.asc | awk -F: '$1 == "fpr" { print $10; exit }')" \
            = "D55C0D1AC78A8D8126CB631CFC9CA96ACA026560"
          gpg --dearmor --output /tmp/hashicorp.gpg /tmp/hashicorp.asc
          sudo install -o root -g root -m 0644 /tmp/hashicorp.gpg \
            /usr/share/keyrings/hashicorp-archive-keyring.gpg
          release_name="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com ${release_name} main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            "terraform=${TERRAFORM_VERSION}-1"
          terraform version

      - name: Check formatting
        run: terraform fmt -check -diff -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate -no-color
