[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "open-transcribe-mcp"
version = "1.1.0"
description = "Provider-independent speech-to-text over MCP."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "OpenTranscribe contributors" }]
keywords = ["mcp", "speech-to-text", "transcription", "fastmcp", "plaud"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastmcp>=4,<5",
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pyyaml>=6,<7",
  "structlog>=25,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
s3 = ["boto3>=1.40,<2"]
dev = [
  "coverage[toml]>=7.10,<8",
  "mkdocs>=1.6,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
open-transcribe-mcp = "open_transcribe.server:main"

[project.urls]
Homepage = "https://github.com/fbossiere/open-transcribe-mcp"
Repository = "https://github.com/fbossiere/open-transcribe-mcp"
Issues = "https://github.com/fbossiere/open-transcribe-mcp/issues"
Documentation = "https://fbossiere.github.io/open-transcribe-mcp/"

[tool.hatch.build.targets.wheel]
packages = ["src/open_transcribe"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "open_transcribe/config"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration_microsoft: live Microsoft integration test",
  "integration_elevenlabs: live ElevenLabs integration test",
  "integration_groq: live Groq integration test",
]

[tool.coverage.run]
branch = true
source = ["open_transcribe"]

[tool.coverage.report]
fail_under = 91
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "ASYNC", "C4", "DTZ", "G", "PIE", "PT", "RET", "RUF", "S", "SIM", "T20", "TRY"]
ignore = ["A002", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["open_transcribe"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true
