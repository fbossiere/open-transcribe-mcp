site_name: OpenTranscribe MCP
site_description: Own the recorder. Choose the intelligence. Provider-independent speech-to-text over MCP.
site_url: https://fbossiere.github.io/open-transcribe-mcp/
repo_url: https://github.com/fbossiere/open-transcribe-mcp
repo_name: GitHub
edit_uri: edit/main/docs/
copyright: OpenTranscribe MCP · Independent open source · Apache 2.0
strict: true
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Overview: index.md
  - Get started:
      - Configuration: configuration.md
      - Linux desktop: desktop.md
      - Plaud on Ubuntu: tutorials/plaud-ubuntu.md
  - Deploy:
      - Scaleway: deploy-scaleway.md
      - OIDC authentication: auth-oidc.md
  - Reference:
      - Providers and capabilities: providers.md
      - Architecture: architecture.md
      - Security: security.md
      - Privacy and retention: privacy.md
  - Recipes:
      - Plaud: recipes/plaud.md
      - ChatGPT and Google Drive: recipes/chatgpt-gdrive.md
  - Maintain:
      - Publication protocol: releasing.md
      - Desktop acceptance: desktop-acceptance.md

plugins:
  - search

extra:
  generator: false

extra_css:
  - stylesheets/site.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
